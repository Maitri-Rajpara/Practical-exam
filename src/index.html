<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
            integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./style/index.css" />
        <title>Document</title>
    </head>
    <body>
        <header>
            <h3>Memory Game</h3>
            <div class="players">
                <div id="player1">Player 1: <span id="score1">0</span></div>
                <div id="player2">Player 2: <span id="score2">0</span></div>
            </div>
        </header>
        <main id="grid" class="grid-4x4"></main>
        <div>
            <div id="timer">Time Left: <span id="time">60</span>s</div>
        </div>

        <footer id="footer">
            <div class="controls">
                <button id="restart-btn">
                    <i class="fa-solid fa-reply-all"></i>
                </button>
                <button id="resume-btn">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button id="pause-btn">
                    <i class="fa-solid fa-pause"></i>
                </button>
            </div>
            <h2 id="winner">Winner:</h2>
            <button id="playAgain-btn">Play Again</button>
        </footer>
    </body>
    <script src="./scripts/main.ts"></script>
</html>
